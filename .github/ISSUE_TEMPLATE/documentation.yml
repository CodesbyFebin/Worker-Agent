name: Documentation Issue
about: Report a documentation issue or suggest improvements
title: '[docs]: '
labels: ['documentation', 'triage']
body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation Issue
      description: What is wrong or missing?
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page/Section
      description: Which documentation page or section is affected?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Fix
      description: How should this be improved?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing documentation
        - label: I have checked the relevant source code for the correct information