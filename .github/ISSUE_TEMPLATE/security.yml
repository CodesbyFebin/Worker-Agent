name: Security Vulnerability
about: Report a security vulnerability
title: '[security]: '
labels: ['security', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        ## Security Policy

        **Do NOT open a public issue for security vulnerabilities.**

        Please report security vulnerabilities responsibly per our [Security Policy](https://github.com/CodesbyFebin/Worker-Agent/blob/main/SECURITY.md):

        1. Do NOT create a public GitHub issue
        2. Email security@workeragent.cloud (or see SECURITY.md)
        3. You will receive a response within 48 hours
        4. We will coordinate a fix and disclosure timeline

        This form is for non-sensitive security feedback only. If this is urgent, contact us directly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the security concern (avoid including exploit details)
    validations:
      required: true

  - type: input
    id: severity
    attributes:
      label: Severity (self-assessed)
      description: Low / Medium / High / Critical
    validations:
      required: true

  - type: input
    id: affected_version
    attributes:
      label: Affected Version(s)
    validations:
      required: true

  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure Preference
      options:
        - label: I will follow the coordinated disclosure process in SECURITY.md
        - label: I prefer to remain anonymous
        required: true