name: Documentation Quality Check

on:
  push:
    branches: [main, rc-*]
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'server/**'
      - 'client/**'
      - 'drizzle/**'

concurrency:
  group: docs-quality
  policy: preempt

jobs:
  docs-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-sitemap-plugin

      - name: Build Documentation (strict)
        run: mkdocs build --strict --site-dir site/docs

      - name: Verify Internal Links
        run: |
          python3 -c "
          import os, re, sys
          broken = []
          docs_dir = 'docs'
          for root, _, files in os.walk(docs_dir):
              for f in files:
                  if not f.endswith('.md'): continue
                  fpath = os.path.join(root, f)
                  with open(fpath) as fh:
                      content = fh.read()
                  links = re.findall(r'\[.*?\]\(([^)]+)\)', content)
                  for link in links:
                      if link.startswith('http') or link.startswith('mailto') or link.startswith('#'): continue
                      target = os.path.normpath(os.path.join(root, link))
                      if not os.path.exists(target):
                          broken.append(f'{fpath} -> {link}')
          if broken:
              print('Broken links found:')
              for b in broken:
                  print(f'  {b}')
              sys.exit(1)
          print('✅ All internal links valid')
          "

      - name: Verify API Documentation Matches Implementation
        run: |
          echo "Checking documented REST endpoints against implementation..."
          for endpoint in "/health" "/openapi.json" "/workflows" "/goals" "/campaigns" "/youtube/channels" "/knowledge/search" "/knowledge/semantic" "/knowledge/embeddings"; do
            grep -q "\"$endpoint\"" docs/architecture/api.md && echo "✓ $endpoint documented" || echo "⚠ $endpoint not in docs"
          done

      - name: Verify tRPC Routers Documented
        run: |
          echo "Checking documented tRPC routers against implementation..."
          for router in auth godMachine workflow agents knowledge tools governance artifacts; do
            grep -q "$router" docs/architecture/api.md && echo "✓ $router documented" || echo "⚠ $router not in docs"
          done

      - name: Verify Package Scripts Match Documentation
        run: |
          echo "Checking documented commands against package.json scripts..."
          for cmd in "dev:api" "dev:worker" "dev:client" "build" "typecheck" "test"; do
            if grep -q "\"$cmd\"" server/package.json client/package.json 2>/dev/null; then
              echo "✓ $cmd command exists"
            else
              echo "❌ $cmd command NOT found in package.json"
              exit 1
            fi
          done

      - name: Verify Environment Variables Reference
        run: |
          echo "Checking documented env vars against .env.example..."
          for var in DATABASE_URL REDIS_URL NODE_ENV OLLAMA_BASE_URL; do
            if grep -q "$var" .env.example 2>/dev/null; then
              echo "✓ $var in .env.example"
            else
              echo "❌ $var NOT in .env.example"
              exit 1
            fi
          done

      - name: Scan for Secrets in Documentation
        run: |
          echo "Scanning docs for accidentally committed secrets..."
          if grep -rE '(sk-[a-zA-Z0-9_-]{8,}|sk-ant-[a-zA-Z0-9_-]{8,}|ghp_[a-zA-Z0-9]{20,}|AWS_SECRET_ACCESS_KEY)' docs/ README.md 2>/dev/null; then
            echo "❌ Potential secret found in documentation!"
            exit 1
          fi
          echo "✅ No secrets found in documentation"

      - name: Documentation Quality Score
        run: |
          echo "=== Documentation Quality Report ==="
          echo "Markdown files in docs/: $(find docs -name '*.md' | wc -l)"
          echo "Documentation pages: $(grep -c '^\s*- ' mkdocs.yml)"
          echo "ADR records: $(ls docs/adr/0*.md 2>/dev/null | wc -l)"
          echo "Example projects: $(ls examples/*/README.md 2>/dev/null | wc -l)"
          echo "CI workflows: $(ls .github/workflows/*.yml | wc -l)"
          echo "Issue templates: $(ls .github/ISSUE_TEMPLATE/*.yml 2>/dev/null | wc -l)"
          echo "✓ Documentation quality check passed"