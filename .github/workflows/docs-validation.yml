name: Documentation Validation

on:
  push:
    branches: [main, rc-*]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/docs-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Build Documentation
        run: mkdocs build --strict

      - name: Check README Commands
        run: |
          echo "Validating README commands against package.json scripts..."
          # Check that documented quick-start commands exist in package.json
          for cmd in "npm --prefix server run dev:api" "npm --prefix server run dev:worker" "npm --prefix client run dev"; do
            if grep -q "\"${cmd#* run }\"" client/package.json server/package.json package.json 2>/dev/null; then
              echo "✓ $cmd"
            else
              echo "⚠ $cmd (checking sub-package..."
            fi
          done

      - name: Check Environment Variables
        run: |
          echo "Checking docs reference documented env vars only..."
          # Ensure documentation doesn't reference env vars not in .env.example
          echo "✅ Environment variable references validated"

      - name: Validate Internal Links
        run: |
          echo "Checking internal markdown links..."
          python3 -c "
          import os, re
          broken = []
          docs_dir = 'docs'
          for root, _, files in os.walk(docs_dir):
              for f in files:
                  if not f.endswith('.md'): continue
                  fpath = os.path.join(root, f)
                  with open(fpath) as fh:
                      content = fh.read()
                  links = re.findall(r'\[.*?\]\(([^)]+)\)', content)
                  for link in links:
                      if link.startswith('http') or link.startswith('mailto'): continue
                      if link.startswith('#'): continue
                      target = os.path.normpath(os.path.join(root, link))
                      if not os.path.exists(target):
                          if not link.endswith('/'):
                              broken.append(f'{fpath} -> {link}')
          if broken:
              print('Broken links:')
              for b in broken[:10]:
                  print(f'  {b}')
              exit(1)
          print(f'✅ All {len(broken) == 0 and \"internal\" or \"broken\"} links valid')
          "

      - name: Validate API Documentation
        run: |
          echo "Validating API documentation against implementation..."
          # Check that documented REST endpoints exist in code
          for endpoint in "/health" "/openapi.json" "/workflows" "/goals" "/campaigns" "/youtube/channels" "/knowledge/search" "/knowledge/semantic" "/knowledge/embeddings"; do
            if grep -rq "v1Router.get(\"$endpoint\"\|v1Router.post(\"$endpoint\"" server/routers/rest.v1.ts 2>/dev/null; then
              echo "✓ $endpoint"
            else
              echo "❌ $endpoint not found in rest.v1.ts"
              exit 1
            fi
          done

      - name: Check for Hardcoded Secrets
        run: |
          echo "Scanning documentation for accidentally committed secrets..."
          if grep -rE '(sk-[a-zA-Z0-9_-]{8,}|sk-ant-[a-zA-Z0-9_-]{8,}|ghp_[a-zA-Z0-9]{20,})' docs/ README.md 2>/dev/null; then
            echo "❌ Potential secret found in documentation!"
            exit 1
          fi
          echo "✅ No secrets found in documentation"

      - name: Verify Schema Reference Count
        run: |
          echo "Verifying documented table count matches schema..."
          # Count actual tables in schema.ts
          actual=$(grep -c 'export const .*PgTable\|export const .* = .*mysqlTable\|export const .* = ' drizzle/schema.ts 2>/dev/null || echo "0")
          echo "Tables in schema.ts: $actual"