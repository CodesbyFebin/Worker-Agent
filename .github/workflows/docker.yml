name: Docker Build & Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Build Production Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API & Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: server
          push: false
          tags: worker-agent/server:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Client (Nginx) Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: client
          push: false
          tags: worker-agent/client:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max