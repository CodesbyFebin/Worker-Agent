name: Schema Guard (Drizzle Drift Detection)

on:
  pull_request:
    paths:
      - 'drizzle/schema.ts'
      - 'drizzle/relations.ts'
      - 'drizzle.config.ts'

jobs:
  schema-drift-check:
    name: Verify Drizzle Schema Reconciliation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Drizzle Kit (Strict Version)
        run: npm install --no-save drizzle-kit@0.24.2

      - name: Generate SQL from Schema
        run: npx drizzle-kit generate --config=drizzle.config.ts

      - name: Check for Uncommitted Schema Drift
        run: |
          if [[ -n $(git status -s drizzle/migrations) ]]; then
            echo "❌ SCHEMA DRIFT DETECTED!"
            echo "You modified drizzle/schema.ts but did not commit the generated SQL."
            echo "Run 'npx drizzle-kit generate' locally and commit the new migration file."
            git status -s drizzle/migrations
            exit 1
          fi
          echo "✅ Schema is perfectly reconciled."