name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate SEO topical authority map
        run: npm run seo:validate

      - name: Security - Dependency audit
        run: npm audit --audit-level=moderate || true

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify public build output
        run: |
          test -f client/dist/index.html
          test -f client/dist/dashboard/index.html
          test -f client/dist/robots.txt
          test -f client/dist/sitemap.xml
          grep -q "The autonomous operating system" client/dist/index.html
          grep -q "noindex,nofollow" client/dist/dashboard/index.html

  accessibility:
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Serve static files
        run: |
          python3 -m http.server 5173 --directory client/dist >/tmp/worker-agent-static.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null

      - name: Run axe accessibility check
        uses: dequelabs/axe-action@v4
        with:
          url: http://127.0.0.1:5173/
          exit: true
          reporter: table

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
