name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install client dependencies
        # client/ has no package-lock.json yet, so npm ci would fail.
        run: npm --prefix client install --no-audit --no-fund

      - name: Typecheck server
        run: npm --prefix server run typecheck

      - name: Typecheck client
        run: npm --prefix client run typecheck

      - name: Lint server (optional)
        run: npm --prefix server run lint --if-present

      - name: Lint client (optional)
        run: npm --prefix client run lint --if-present

      - name: Test server (optional)
        run: npm --prefix server run test --if-present

      - name: Test client (optional)
        run: npm --prefix client run test --if-present

      - name: Build server
        run: npm --prefix server run build

      - name: Build client
        run: npm --prefix client run build
