name: CI Pipeline

on:
  push:
    branches: [main, rc-*]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Typecheck & Test (Node 20)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci --ignore-scripts

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Typecheck Server
        run: npm --prefix server run typecheck

      - name: Typecheck Client
        run: npm --prefix client run typecheck

      - name: Run Server Tests (Vitest)
        run: npm --prefix server run test
        env:
          DATABASE_URL: "mysql://root:password@localhost:3306/worker_agent_test"
          REDIS_URL: "redis://localhost:6379"

      - name: Build Client (Vite)
        run: npm --prefix client run build